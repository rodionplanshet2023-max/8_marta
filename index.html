<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>С 8 Марта, Мамочка!</title>
    <style>
        /* Обнуляем отступы и делаем фон */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #f9e3e3 0%, #fed9e5 40%, #ffe4d6 100%);
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            position: relative;
            overflow-x: hidden;
        }

        /* Контейнер для лепестков (летают поверх фона) */
        .petal-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Чтобы лепестки не мешали нажимать на кнопки */
            z-index: 5;
            overflow: hidden;
        }

        /* Стили для лепестков */
        .petal {
            position: absolute;
            background-color: #ffb7c5;
            border-radius: 150% 0 150% 0;
            opacity: 0.6;
            transform: rotate(45deg);
            box-shadow: 0 5px 10px rgba(255, 200, 220, 0.5);
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(45deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(100vh) rotate(90deg);
                opacity: 0.2;
            }
        }

        /* Главная открытка */
        .card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 50px 20px 50px 20px;
            box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.2), inset 0 0 0 1px rgba(255, 255, 255, 0.7);
            max-width: 900px;
            width: 100%;
            padding: 35px 25px;
            z-index: 10;
            position: relative;
            transition: transform 0.4s ease;
            animation: card-appear 1.2s ease-out;
        }

        @keyframes card-appear {
            0% {
                opacity: 0;
                transform: scale(0.9) translateY(30px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* Заголовок с анимацией */
        h1 {
            font-size: clamp(2.2rem, 10vw, 4rem);
            text-align: center;
            color: #9b4b6e;
            text-shadow: 3px 3px 0 #ffd9e8, 5px 5px 0 rgba(255, 200, 220, 0.5);
            margin-bottom: 15px;
            font-weight: 800;
            letter-spacing: 2px;
            animation: glow 3s infinite alternate;
            word-break: break-word;
        }

        @keyframes glow {
            0% { text-shadow: 3px 3px 0 #ffd9e8, 5px 5px 0 rgba(255, 200, 220, 0.5); }
            100% { text-shadow: 5px 5px 0 #ffe2f0, 8px 8px 0 rgba(255, 150, 190, 0.6); }
        }

        .subtitle {
            font-size: clamp(1.2rem, 5vw, 1.8rem);
            text-align: center;
            color: #9f5e7a;
            margin-bottom: 40px;
            font-style: italic;
            opacity: 0;
            animation: fadeInUp 1s 0.3s forwards;
            border-bottom: 2px dashed #ffa5c3;
            padding-bottom: 15px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Сетка с цветами */
        .flowers-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-end;
            gap: 15px 25px;
            margin: 40px 0 30px;
        }

        /* Один цветок (тюльпан) */
        .flower {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.3s ease;
            animation: pop 0.5s ease-out;
            flex: 0 1 auto;
            min-width: 80px;
        }

        .flower:hover {
            transform: scale(1.1) rotate(2deg);
        }

        @keyframes pop {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Стебель */
        .stem {
            width: 8px;
            height: 70px;
            background: linear-gradient(90deg, #6b8c5c, #8fc27e);
            border-radius: 4px;
            margin-bottom: 2px;
            box-shadow: 0 5px 5px rgba(0,0,0,0.1);
            position: relative;
        }

        /* Листик */
        .stem::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 12px;
            background: #9fc78b;
            border-radius: 50%;
            left: -15px;
            top: 30px;
            transform: rotate(-20deg);
            opacity: 0.8;
        }

        /* Бутон */
        .bud {
            width: 50px;
            height: 60px;
            background: #ff8da1;
            border-radius: 50% 50% 40% 40%;
            transform: rotate(10deg);
            box-shadow: 0 8px 0 #b95c73, 0 10px 15px rgba(255, 120, 140, 0.4);
            transition: all 0.3s ease;
            position: relative;
            margin-bottom: -5px;
        }

        /* Разноцветные бутоны */
        .flower:nth-child(1) .bud { background: #ff99aa; box-shadow: 0 8px 0 #c26b7a; }
        .flower:nth-child(2) .bud { background: #ffb3c6; box-shadow: 0 8px 0 #c98598; }
        .flower:nth-child(3) .bud { background: #ffc2d9; box-shadow: 0 8px 0 #c992ab; }
        .flower:nth-child(4) .bud { background: #ffa3b8; box-shadow: 0 8px 0 #bf738b; }
        .flower:nth-child(5) .bud { background: #ffd0dd; box-shadow: 0 8px 0 #c997a8; }

        /* Лепестки (два дополнительных) */
        .bud::before,
        .bud::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 45px;
            background: inherit;
            border-radius: 50%;
            top: 5px;
            opacity: 0.8;
        }
        .bud::before {
            left: -15px;
            transform: rotate(-25deg);
        }
        .bud::after {
            right: -15px;
            transform: rotate(25deg);
        }

        /* Серединка */
        .center {
            width: 15px;
            height: 15px;
            background: #fde74c;
            border-radius: 50%;
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 10px #ffee88;
            z-index: 5;
        }

        /* Текст поздравления */
        .message {
            background: rgba(255, 255, 255, 0.6);
            padding: 25px 20px;
            border-radius: 70px 20px 70px 20px;
            margin: 30px 0 20px;
            backdrop-filter: blur(5px);
            border: 1px solid white;
            box-shadow: 0 10px 20px rgba(255, 140, 170, 0.2);
            animation: slideIn 1s 0.6s both;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .message p {
            font-size: clamp(1.2rem, 4vw, 1.7rem);
            color: #7d4b62;
            line-height: 1.5;
            text-align: center;
            font-weight: 500;
            word-break: break-word;
        }

        .message span {
            font-size: 2rem;
            display: inline-block;
            animation: heartbeat 1.8s infinite;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            30% { transform: scale(1.3); }
            50% { transform: scale(1.1); }
            70% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        /* Кнопка-сюрприз */
        .surprise-btn {
            background: #ffb1c7;
            border: none;
            color: #5e3a4b;
            padding: 18px 35px;
            font-size: clamp(1.2rem, 5vw, 1.8rem);
            border-radius: 60px 20px 60px 20px;
            box-shadow: 0 10px 0 #b35f7a, 0 8px 20px #ffb8cf;
            font-weight: bold;
            cursor: pointer;
            display: block;
            margin: 20px auto 10px;
            transition: all 0.1s ease;
            border: 2px solid white;
            backdrop-filter: blur(5px);
            animation: btn-pulse 2s infinite;
        }

        .surprise-btn:active {
            transform: translateY(8px);
            box-shadow: 0 2px 0 #b35f7a, 0 5px 15px #ffb8cf;
        }

        @keyframes btn-pulse {
            0% { box-shadow: 0 10px 0 #b35f7a, 0 8px 20px #ffb8cf; }
            50% { box-shadow: 0 10px 0 #d46f90, 0 8px 30px #ff98b9; }
            100% { box-shadow: 0 10px 0 #b35f7a, 0 8px 20px #ffb8cf; }
        }

        /* Адаптация для маленьких экранов */
        @media (max-width: 500px) {
            .card {
                padding: 25px 15px;
            }
            .bud {
                width: 40px;
                height: 50px;
            }
            .bud::before, .bud::after {
                width: 25px;
                height: 35px;
            }
            .stem {
                height: 50px;
            }
        }

        /* Дополнительные маленькие сердечки (парят) */
        .floating-heart {
            position: absolute;
            color: #ff95a8;
            font-size: 1.5rem;
            opacity: 0.5;
            animation: floatAround 8s infinite alternate ease-in-out;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes floatAround {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(20px, -30px) rotate(20deg); }
        }
    </style>
</head>
<body>

    <!-- Фоновые лепестки (генерируются через JS) -->
    <div class="petal-container" id="petal-container"></div>

    <!-- Плавающие сердечки (для красоты) -->
    <div class="floating-heart" style="top: 10%; left: 5%;">🌸</div>
    <div class="floating-heart" style="top: 70%; left: 90%; animation-duration: 10s;">🌷</div>
    <div class="floating-heart" style="top: 20%; left: 85%;">💖</div>
    <div class="floating-heart" style="top: 80%; left: 15%; animation-duration: 12s;">🌹</div>
    <div class="floating-heart" style="top: 40%; left: 10%;">🌺</div>

    <!-- Основная открытка -->
    <div class="card">
        <h1>С 8 Марта!</h1>
        <div class="subtitle">Мамочка, любимая</div>

        <!-- Букет цветов (с анимацией) -->
        <div class="flowers-grid">
            <div class="flower" style="animation-delay: 0.1s;">
                <div class="bud">
                    <div class="center"></div>
                </div>
                <div class="stem"></div>
            </div>
            <div class="flower" style="animation-delay: 0.3s;">
                <div class="bud">
                    <div class="center"></div>
                </div>
                <div class="stem"></div>
            </div>
            <div class="flower" style="animation-delay: 0.5s;">
                <div class="bud">
                    <div class="center"></div>
                </div>
                <div class="stem"></div>
            </div>
            <div class="flower" style="animation-delay: 0.7s;">
                <div class="bud">
                    <div class="center"></div>
                </div>
                <div class="stem"></div>
            </div>
            <div class="flower" style="animation-delay: 0.9s;">
                <div class="bud">
                    <div class="center"></div>
                </div>
                <div class="stem"></div>
            </div>
        </div>

        <!-- Тёплые слова -->
        <div class="message">
            <p>
                Ты самый дорогой человек в моей жизни!<br>
                Пусть каждый день дарит тебе улыбки,<br>
                цветы и тепло. Спасибо за всё!<br>
                <span>❤️</span>
            </p>
        </div>

        <!-- Кнопка для дополнительного сюрприза -->
        <button class="surprise-btn" id="surpriseButton">Нажми для поцелуя 💋</button>
    </div>

    <script>
        (function() {
            // 1. Создаём летающие лепестки
            const petalContainer = document.getElementById('petal-container');
            const petalCount = 25; // Количество лепестков

            for (let i = 0; i < petalCount; i++) {
                const petal = document.createElement('div');
                petal.classList.add('petal');

                // Случайные размеры
                const size = Math.random() * 20 + 15; // от 15px до 35px
                petal.style.width = size + 'px';
                petal.style.height = (size * 0.8) + 'px';

                // Случайное положение слева
                petal.style.left = Math.random() * 100 + '%';

                // Случайная задержка анимации
                petal.style.animationDelay = Math.random() * 15 + 's';
                // Длительность анимации (чтобы лепестки падали с разной скоростью)
                petal.style.animationDuration = Math.random() * 10 + 8 + 's'; // от 8 до 18 секунд

                // Немного разного цвета
                petal.style.backgroundColor = `hsl(${Math.random() * 20 + 340}, 80%, 80%)`; // розовые оттенки

                petalContainer.appendChild(petal);
            }

            // 2. Кнопка-сюрприз
            const surpriseBtn = document.getElementById('surpriseButton');
            surpriseBtn.addEventListener('click', function() {
                // Создаём всплывающие сердечки
                for (let i = 0; i < 12; i++) {
                    createFloatingEmoji('💖');
                    createFloatingEmoji('🌸');
                    createFloatingEmoji('🌷');
                }
                // Показываем сообщение (простой alert, но можно что-то креативнее)
                alert('Мамочка, ты самая лучшая! 🌷 Целую крепко!');

                // Добавляем временный большой текст
                const extraMessage = document.createElement('div');
                extraMessage.textContent = '💋 💋 💋';
                extraMessage.style.textAlign = 'center';
                extraMessage.style.fontSize = '3rem';
                extraMessage.style.animation = 'pop 0.5s';
                extraMessage.style.marginTop = '10px';
                document.querySelector('.card').appendChild(extraMessage);
                setTimeout(() => extraMessage.remove(), 2000);
            });

            function createFloatingEmoji(emoji) {
                const span = document.createElement('span');
                span.textContent = emoji;
                span.style.position = 'fixed';
                span.style.left = Math.random() * 100 + '%';
                span.style.top = Math.random() * 100 + '%';
                span.style.fontSize = Math.random() * 30 + 20 + 'px';
                span.style.opacity = '0.8';
                span.style.pointerEvents = 'none';
                span.style.zIndex = '9999';
                span.style.animation = 'pop 0.8s ease-out forwards';
                document.body.appendChild(span);
                setTimeout(() => span.remove(), 800);
            }

            // 3. Лёгкая анимация при наведении на цветы (на телефонах - по клику)
            const flowers = document.querySelectorAll('.flower');
            flowers.forEach(flower => {
                flower.addEventListener('click', function() {
                    this.style.transform = 'scale(1.2) rotate(5deg)';
                    setTimeout(() => {
                        this.style.transform = 'scale(1) rotate(0deg)';
                    }, 200);
                });
            });

        })();
    </script>

    <!-- Дополнительные стили для анимации появления emoji -->
    <style>
        @keyframes pop {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }
    </style>
</body>
</html>
